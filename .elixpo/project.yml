  family: service
  artifact_type: hosted-service
  lifecycle: active
  relationship: core
  custody: elixpo-owned
  stack: nextjs
  node_version: "24"
  repository: https://github.com/elixpo/research.elixpo
  deployment: https://research.elixpo.com
  discussions: https://github.com/orgs/elixpo/discussions
