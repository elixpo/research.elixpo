name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_domain:
        description: Attach research.elixpo.com after the candidate passes every smoke test
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write

concurrency:
  group: research-elixpo-cloudflare-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize canonical research snapshot
        run: npm run registry:sync

      - name: Verify canonical research snapshot
        run: npm run registry:check

      - name: Build static publication site
        run: npm run build

      - name: Verify crawl and scholarly metadata
        run: npm run site:check

      - name: Upload static publication site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: research-elixpo-site
          path: out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  # The candidate is the Pages production branch served at research-elixpo.pages.dev;
  # research.elixpo.com is attached only by a manual promote_domain dispatch.
  # The shared workflow also creates the Pages project when it is missing.
  deploy:
    name: Deploy candidate
    needs: build
    uses: elixpo/agent.elixpo/.github/workflows/deploy-cloudflare-pages.yml@main
    with:
      project-name: research-elixpo
      artifact-name: research-elixpo-site
      output-directory: out
      node-version: "24"
      branch: main
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    name: Smoke-test candidate publication
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-pages-candidate
      url: https://research-elixpo.pages.dev
    steps:
      - name: Smoke-test candidate publication
        env:
          CANDIDATE_URL: https://research-elixpo.pages.dev
        run: |
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 12 --retry-all-errors --retry-delay 5 "$@"
          }

          for route in \
            / \
            /octabit/ \
            /oreolook/ \
            /monodiffuse/ \
            /robots.txt \
            /sitemap.xml \
            /feed.xml
          do
            fetch --output /dev/null "$CANDIDATE_URL$route"
          done

          fetch --output /tmp/research-home.html "$CANDIDATE_URL/"
          grep -q '<link rel="canonical" href="https://research.elixpo.com"' /tmp/research-home.html
          grep -q '<meta name="robots" content="index, follow"' /tmp/research-home.html

  # Attaching a custom domain is not something the shared workflow does, so promotion stays local.
  promote:
    name: Promote custom domain
    needs: smoke
    if: github.event_name == 'workflow_dispatch' && inputs.promote_domain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Attach production custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/research-elixpo/domains"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            "$endpoint" > /tmp/cloudflare-domains.json

          if python3 -c 'import json; data=json.load(open("/tmp/cloudflare-domains.json")); raise SystemExit(0 if any(item.get("name") == "research.elixpo.com" for item in data.get("result", [])) else 1)'
          then
            echo 'research.elixpo.com is already attached to the Pages project.'
          else
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"name":"research.elixpo.com"}' \
              "$endpoint" > /tmp/cloudflare-domain-create.json
            python3 -c 'import json; data=json.load(open("/tmp/cloudflare-domain-create.json")); assert data.get("success"), data.get("errors")'
          fi

      - name: Verify production hostname after promotion
        run: |
          for route in / /octabit/ /oreolook/ /monodiffuse/ /robots.txt /sitemap.xml /feed.xml
          do
            curl --fail --silent --show-error --location \
              --retry 30 --retry-all-errors --retry-delay 10 \
              --output /dev/null "https://research.elixpo.com$route"
          done
