name: Registry snapshot

on:
  pull_request:
    paths:
      - "content/**"
      - "scripts/sync-registry.mjs"
      - ".github/workflows/registry-drift.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: registry-snapshot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify canonical snapshot
        run: npm run registry:check
